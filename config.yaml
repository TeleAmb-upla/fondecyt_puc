# Fondecyt PUC — Pumahuida (PUC + Teleamb)

shapefile_id_col: wetland_id
shapefile_name_col: nombre
master_aoi_path: data/shapefiles/pumahuida_aoi.geojson

year_start: 2025
year_end: auto

wetlands:
  exotico:
    name: "Parcela exótico"
    aoi_source: data/vectors/pumahuida/pumahuida_exotico.shp
    color: "#c0392b"
  cae1:
    name: "Parcela CAE 1"
    aoi_source: data/vectors/pumahuida/pumahuida_cae1.shp
    color: "#1d6b4a"
  cae2:
    name: "Parcela CAE 2"
    aoi_source: data/vectors/pumahuida/pumahuida_cae2.shp
    color: "#2b6cb0"

sources:
  sentinel2:
    label: "Sentinel-2 semanal"
    input_root: data/sentinel2
    static_root: data_static/sentinel2
    enabled: true
  drone:
    label: "Dron multiespectral"
    description: "Ortofotos por fecha de vuelo (cuando estén cargadas)."
    input_root: data/drone
    static_root: data_static/drone
    enabled: true
    flat_date_filenames: true
    indices: [ndvi, ndwi, rgb]

indices:
  ndvi:
    label: "NDVI"
    colormap: RdYlGn
    vmin: -1
    vmax: 1
  ndwi:
    label: "NDWI"
    colormap: RdYlBu
    vmin: -1
    vmax: 1
  rgb:
    label: "RGB"
    visual_only: true

raster_visualization:
  webp_quality: 86
  webp_upscale_min_side: 384

gee:
  cloud_project: teleamb-494020
  collection: projects/ee-teleamb/assets/S2_weekly_pumahuida
  drive_folder: FONDECYT_S2_weekly_pumahuida
  scale_m: 10
